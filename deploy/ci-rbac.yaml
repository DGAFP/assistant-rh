# Appliquer uniquement sur le cluster staging par un opérateur.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-deploy
  namespace: assistant-rh-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-deploy
  namespace: assistant-rh-api
rules:
  - apiGroups: [""]
    resources: [services, secrets, configmaps, pods]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-deploy
  namespace: assistant-rh-api
subjects:
  - kind: ServiceAccount
    name: github-deploy
    namespace: assistant-rh-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-deploy
