apiVersion: v1
kind: Pod
metadata:
  name: '{{ .Release.Name }}-staging-smoke'
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 120
  automountServiceAccountToken: false
  imagePullSecrets:
  - name: scw-registry
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: health
    image: '{{ .Values.image.repository }}@{{ .Values.image.digest }}'
    command:
    - python
    - -c
    - 'import json,urllib.request; d=json.load(urllib.request.urlopen("http://assistant-rh-api:8000/healthz",timeout=10));
      assert d["status"]=="ok" and d["db"]=="ok" and d["config_loaded"] is True; print("API
      health/config/db: OK")'
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
