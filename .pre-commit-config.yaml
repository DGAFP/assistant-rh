repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.5
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: cve-lite-js
        name: CVE Lite JS dependency scan
        entry: pnpm security:scan:js
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: strip-notebook-outputs
        name: strip notebook outputs
        entry: python3 scripts/strip_notebook_outputs.py --fix
        language: system
        files: \.ipynb$
