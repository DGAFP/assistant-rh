default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.5
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: strip-notebook-outputs
        name: strip notebook outputs
        entry: python3 scripts/strip_notebook_outputs.py --fix
        language: system
        files: \.ipynb$
      - id: api-pre-push-checks
        name: API checks before push
        entry: moon run api:smoke api:lint api:architecture api:test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
