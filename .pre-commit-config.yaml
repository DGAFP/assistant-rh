repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.5
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: strip-notebook-outputs
        name: strip notebook outputs
        entry: python3 scripts/strip_notebook_outputs.py --fix
        language: system
        files: \.ipynb$
