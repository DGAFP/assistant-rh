repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.5
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/biomejs/pre-commit
    rev: v2.4.14
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.4.14"]
        files: ^apps/mastra-pipeline/.*\.tsx?$

  - repo: local
    hooks:
      - id: cve-lite-js
        name: CVE Lite JS dependency scan
        entry: pnpm security:scan:js
        language: system
        files: ^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.npmrc|apps/mastra-pipeline/package\.json)$
        pass_filenames: false
        stages: [pre-push]

      - id: strip-notebook-outputs
        name: strip notebook outputs
        entry: python3 scripts/strip_notebook_outputs.py --fix
        language: system
        files: \.ipynb$
