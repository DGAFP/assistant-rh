name: CI Tests

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: .uv-cache
      API_SYNTHETIC_POSTGRES_DSN: postgresql://assistant_rh_api:assistant_rh_api@127.0.0.1:55433/assistant_rh_api_test?sslmode=disable
    services:
      api-postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: assistant_rh_api
          POSTGRES_PASSWORD: assistant_rh_api
          POSTGRES_DB: assistant_rh_api_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U assistant_rh_api -d assistant_rh_api_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages --group dev --frozen

      - name: Lint check
        run: uv run --no-sync ruff check src apps/streamlit-ui/pages apps/api/src apps/api/tests tests --select E,F,I

      - name: Check API import boundaries
        run: uv run --no-sync lint-imports --config apps/api/pyproject.toml --no-cache

      - name: Run API tests on synthetic Postgres
        # Real-corpus replay runs separately on trusted branch revisions below.
        run: uv run --no-sync python -m pytest apps/api/tests --ignore=apps/api/tests/core/test_m0b_companion.py -v

      - name: Run tests
        run: uv run --no-sync python -m pytest tests/ --ignore=tests/archive -v

      - name: Check pipeline imports
        run: |
          uv run --no-sync python -c "
          from assistant_rh_rag_pipeline.pipeline import Pipeline
          from assistant_rh_rag_pipeline.models import PipelineResult, RetrievedChunk, ContextItem
          from assistant_rh_rag_pipeline.config import RAGConfig
          print('All pipeline imports OK')
          "

      - name: Build API image
        run: docker build -f docker/api/Dockerfile -t assistant-rh-api:${{ github.sha }} .

      - name: Smoke test local stack authentication
        env:
          COMPOSE_PROJECT_NAME: api-auth-smoke
          # Let Docker allocate free host ports on the runner.
          API_PORT: "0"
          API_POSTGRES_PORT: "0"
        run: |
          trap 'docker compose --project-directory . -f docker/api/compose.yml down -v' EXIT
          docker compose --project-directory . -f docker/api/compose.yml up --build -d --wait
          smoke_endpoint=$(docker compose --project-directory . -f docker/api/compose.yml port api 8000)
          API_PORT="${smoke_endpoint##*:}" uv run --no-sync python docker/api/smoke-auth.py

  private-conformance:
    name: Private M0b conformance
    needs: tests
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      contains(fromJSON('["dev", "staging", "main"]'), github.ref_name)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This existing environment only permits dev, staging and main.
    # PR code must never receive the private corpus or its download token.
    environment: scaleway-staging
    permissions:
      contents: read
    steps:
      - name: Checkout trusted branch revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-packages --group dev --frozen

      - name: Download checksum-verified private evidence
        env:
          HF_TOKEN: ${{ secrets.HF_CONFORMANCE_TOKEN }}
        run: |
          if ! archive=$(uv run --no-sync python -m scripts.conformance.m0b_private "$RUNNER_TEMP/m0b-private" \
            2> "$RUNNER_TEMP/m0b-download.log"); then
            echo "::error::Private conformance download failed; check dataset access and checksum."
            exit 1
          fi
          echo "M0B_PRIVATE_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Replay all seven scenarios and negative controls
        env:
          PYTHON_DOTENV_DISABLED: "1"
        run: |
          if uv run --no-sync python -m pytest apps/api/tests/core/test_m0b_companion.py -q \
            > "$RUNNER_TEMP/m0b-private.log" 2>&1; then
            echo "Private conformance: all tests passed."
          else
            echo "::error::Private conformance failed; reproduce locally on this revision."
            exit 1
          fi
