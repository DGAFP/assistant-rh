name: Kapsule staging
on:
  pull_request:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publier les images et déployer le nouveau staging Kapsule
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: kapsule-staging-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.20.2
      - name: Validate Helm and shell
        run: |
          set -euo pipefail
          python3 -m pip install 'PyYAML==6.0.3'
          python3 deploy/api/test_deploy_permissions.py
          python3 deploy/api/test_wait_required_checks.py
          python3 deploy/api/test_package_staging.py
          bash -n deploy/api/deploy.sh
          helm lint deploy/api --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          helm template assistant-rh-api deploy/api --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa > /dev/null
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build images without credentials
        run: |
          docker buildx build --platform linux/amd64 -f docker/api/Dockerfile .
  required-checks:
    needs: validate
    if: >-
      github.repository == 'DGAFP/assistant-rh' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/staging' &&
      (inputs.deploy == true || vars.KAPSULE_STAGING_CD_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Require successful CI on this exact revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/api/wait-required-checks.py
  publish:
    needs: [validate, required-checks]
    if: >-
      github.repository == 'DGAFP/assistant-rh' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/staging' &&
      (inputs.deploy == true || vars.KAPSULE_STAGING_CD_ENABLED == 'true')
    environment: kapsule-staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.images.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.20.2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Refuse an obsolete staging revision
        run: |
          set -euo pipefail
          tip=$(git ls-remote origin refs/heads/staging | cut -f1)
          test "$tip" = "$GITHUB_SHA" || { echo 'staging advanced; refusing obsolete delivery' >&2; exit 1; }
      - name: Authenticate to the dedicated staging registry
        env:
          REGISTRY_KEY: ${{ secrets.SCW_REGISTRY_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_KEY" || { echo 'SCW_REGISTRY_SECRET_KEY missing' >&2; exit 1; }
          printf '%s' "$REGISTRY_KEY" | docker login rg.fr-par.scw.cloud/assistant-rh-staging -u nologin --password-stdin
      - name: Build release images
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 -f docker/api/Dockerfile --load -t "rg.fr-par.scw.cloud/assistant-rh-staging/assistant-rh-api:sha-${GITHUB_SHA}" .
      - name: Scan api release image
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e
        with:
          version: v0.75.0
          image-ref: rg.fr-par.scw.cloud/assistant-rh-staging/assistant-rh-api:sha-${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - name: Publish scanned images
        id: images
        run: |
          set -euo pipefail
          image="rg.fr-par.scw.cloud/assistant-rh-staging/assistant-rh-api:sha-${GITHUB_SHA}"
          docker push "$image"
          digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          echo "digest=${digest##*@}" >> "$GITHUB_OUTPUT"
      - name: Package the validated staging release for Flux
        id: chart
        env:
          IMAGE_DIGEST: ${{ steps.images.outputs.digest }}
          BUNDLE_OUTPUT_DIR: ${{ runner.temp }}/staging-chart
        run: python3 deploy/api/package-staging.py
      - name: Publish the staging chart for Flux
        env:
          REGISTRY_KEY: ${{ secrets.SCW_REGISTRY_SECRET_KEY }}
          CHART_PATH: ${{ steps.chart.outputs.chart_path }}
        run: |
          set -euo pipefail
          tip=$(git ls-remote origin refs/heads/staging | cut -f1)
          test "$tip" = "$GITHUB_SHA" || { echo 'staging advanced; refusing obsolete delivery' >&2; exit 1; }
          printf '%s' "$REGISTRY_KEY" | helm registry login rg.fr-par.scw.cloud -u nologin --password-stdin
          helm push "$CHART_PATH" oci://rg.fr-par.scw.cloud/assistant-rh-staging
          echo "Chart published; deployment readiness is reported by the Flux HelmRelease." >> "$GITHUB_STEP_SUMMARY"
      - name: Logout
        if: always()
        run: |
          docker logout rg.fr-par.scw.cloud/assistant-rh-staging
          helm registry logout rg.fr-par.scw.cloud
