name: Kapsule staging
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: kapsule-validation-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.20.2
      - name: Validate Helm and shell
        run: |
          set -euo pipefail
          python3 -m pip install 'PyYAML==6.0.3'
          python3 deploy/api/test_deploy_permissions.py
          python3 deploy/api/test_wait_required_checks.py
          python3 deploy/api/test_package_staging.py
          python3 deploy/api/test_release.py
          bash -n deploy/api/deploy.sh
          helm lint deploy/api --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          helm template assistant-rh-api deploy/api --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa > /dev/null
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build images without credentials
        run: |
          docker buildx build --platform linux/amd64 -f docker/api/Dockerfile --load -t assistant-rh-api:ci .
      - name: Scan API validation image
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          version: v0.75.0
          image-ref: assistant-rh-api:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
