name: Data Engineering Preview Staging

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/data-engineering-*.yml"
      - ".github/scripts/data_engineering_plan.py"
      - ".github/scripts/scaleway_data_jobs.py"
      - ".github/data-engineering-jobs.json"
      - "packages/data-engineering/**"
      - "packages/shared-config/**"
      - "config/**"
      - "Dockerfile.service_public_pipeline"
      - "Dockerfile.service_public_ingestion"
      - "Dockerfile.legifrance_pipeline"
      - "Dockerfile.legifrance_ingestion"
      - "Dockerfile.legifrance_bulk_dump"
      - "Dockerfile.embeddings_job"
  workflow_dispatch:
    inputs:
      source:
        description: "Source a traiter"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - service_public
          - legifrance
          - embeddings
      run_ingestion:
        description: "Ingerer aussi dans la base Scaleway staging"
        required: true
        default: true
        type: boolean
      wipe_existing_chunks:
        description: "Supprimer les chunks Service-Public existants avant re-ingestion (requiert run_embeddings=true et embedding_source=service_public/all)"
        required: true
        default: false
        type: boolean
      run_embeddings:
        description: "Backfill embeddings si l'image embeddings est concernee (obligatoire avec wipe_existing_chunks)"
        required: true
        default: false
        type: boolean
      embedding_source:
        description: "Source embeddings a backfiller"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - service_public
          - legifrance
      embedding_only_column:
        description: "Colonne embeddings cible optionnelle, ex: embedding_m3"
        required: false
        default: ""
        type: string
      run_preview_jobs:
        description: "Executer les jobs Scaleway staging (medallion/ingestion/embeddings)"
        required: true
        default: false
        type: boolean
      service_public_fiche_config:
        description: "Config JSON Service-Public"
        required: true
        default: "config/service_public_fiches.json"
        type: string
      legifrance_article_ids_json:
        description: "Manifest article IDs Legifrance pour le bulk dump"
        required: true
        default: "config/legifrance_article_cids.json"
        type: string

permissions:
  contents: read

concurrency:
  group: data-preview-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_HOST: rg.fr-par.scw.cloud
  STAGING_IMAGE_TAG: staging-${{ github.sha }}

jobs:
  plan:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    outputs:
      service_public: ${{ steps.plan.outputs.service_public }}
      legifrance: ${{ steps.plan.outputs.legifrance }}
      embeddings: ${{ steps.plan.outputs.embeddings }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
      has_runs: ${{ steps.plan.outputs.has_runs }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed data engineering jobs
        id: plan
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          INPUT_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.source || '' }}
        run: python3 .github/scripts/data_engineering_plan.py

  build-staging-images:
    runs-on: ubuntu-latest
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.has_builds == 'true' }}
    timeout-minutes: 90
    environment: scaleway-staging
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Scaleway Container Registry
        env:
          REGISTRY_NAMESPACE: ${{ vars.SCW_CONTAINER_REGISTRY_NAMESPACE }}
          REGISTRY_PASSWORD: ${{ secrets.SCW_SECRET_KEY }}
          REGISTRY_PASSWORD_FALLBACK: ${{ secrets.SCALEWAY_API_KEY }}
        run: |
          REGISTRY_NAMESPACE="${REGISTRY_NAMESPACE:-assistant-rh}"
          REGISTRY_PASSWORD="${REGISTRY_PASSWORD:-${REGISTRY_PASSWORD_FALLBACK:-}}"
          if [ -z "${REGISTRY_PASSWORD}" ]; then
            echo "Missing Scaleway registry secret: define SCW_SECRET_KEY or SCALEWAY_API_KEY." >&2
            exit 1
          fi
          printf '%s' "${REGISTRY_PASSWORD}" | docker login \
            ${{ env.REGISTRY_HOST }}/${REGISTRY_NAMESPACE} \
            -u nologin \
            --password-stdin

      - name: Build and push staging image
        env:
          REGISTRY_NAMESPACE: ${{ vars.SCW_CONTAINER_REGISTRY_NAMESPACE }}
        run: |
          REGISTRY_NAMESPACE="${REGISTRY_NAMESPACE:-assistant-rh}"
          docker buildx build \
            --platform linux/amd64 \
            -f "${{ matrix.dockerfile }}" \
            -t "${{ env.REGISTRY_HOST }}/${REGISTRY_NAMESPACE}/${{ matrix.image }}:${{ env.STAGING_IMAGE_TAG }}" \
            -t "${{ env.REGISTRY_HOST }}/${REGISTRY_NAMESPACE}/${{ matrix.image }}:staging-latest" \
            --push \
            .

  preview-staging:
    runs-on: ubuntu-latest
    needs:
      - plan
      - build-staging-images
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.has_runs == 'true' && needs.build-staging-images.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.run_preview_jobs }}
    timeout-minutes: 180
    environment: scaleway-staging
    env:
      # Phase 2: preview job execution is manual-only (workflow_dispatch + run_preview_jobs=true).
      SERVICE_PUBLIC_SELECTED: ${{ needs.plan.outputs.service_public }}
      RUN_INGESTION: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ingestion || false }}
      WIPE_EXISTING_CHUNKS: ${{ github.event_name == 'workflow_dispatch' && inputs.wipe_existing_chunks || false }}
      RUN_EMBEDDINGS: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_embeddings || inputs.source == 'embeddings') || false }}
      EMBEDDING_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.embedding_source || 'all' }}
      EMBEDDING_ONLY_COLUMN: ${{ github.event_name == 'workflow_dispatch' && inputs.embedding_only_column || '' }}
      SERVICE_PUBLIC_FICHE_CONFIG: ${{ github.event_name == 'workflow_dispatch' && inputs.service_public_fiche_config || 'config/service_public_fiches.json' }}
      LEGIFRANCE_ARTICLE_IDS_JSON: ${{ github.event_name == 'workflow_dispatch' && inputs.legifrance_article_ids_json || 'config/legifrance_article_cids.json' }}
      SCW_DEFAULT_REGION: fr-par
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      SCW_CONTAINER_REGISTRY_NAMESPACE: ${{ vars.SCW_CONTAINER_REGISTRY_NAMESPACE }}
      SCW_BUCKET_BRONZE: assistant-rh-bronze
      SCW_BUCKET_SILVER: assistant-rh-silver
      SCW_BUCKET_GOLD: assistant-rh-gold
      SCW_PREFIX_STAGING: staging
      SCW_PREFIX_PROD: prod
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_POSTGRES_DSN: ${{ secrets.SCW_POSTGRES_DSN }}
      SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
      SCALEWAY_BASE_URL: ${{ vars.SCALEWAY_BASE_URL || 'https://api.scaleway.ai/v1' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate Service-Public wipe/backfill selection
        run: |
          if [[ "${SERVICE_PUBLIC_SELECTED}" == "true" && "${RUN_INGESTION}" == "true" && "${WIPE_EXISTING_CHUNKS}" == "true" ]]; then
            if [[ "${RUN_EMBEDDINGS}" != "true" || "${EMBEDDING_SOURCE}" == "legifrance" ]]; then
              echo "::error::wipe_existing_chunks deletes Service-Public chunk embeddings. Select run_embeddings=true and embedding_source=service_public or all."
              exit 1
            fi
          fi

      - name: Install Scaleway CLI
        uses: scaleway/action-scw@v0.0.3
        with:
          version: v2.54.0
          save-config: true
          export-config: true
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}

      - name: Start selected Scaleway staging jobs
        run: |
          python3 .github/scripts/scaleway_data_jobs.py \
            --target-env staging \
            --image-tag "${STAGING_IMAGE_TAG}" \
            --service-public "${{ needs.plan.outputs.service_public }}" \
            --legifrance "${{ needs.plan.outputs.legifrance }}" \
            --embeddings "${{ needs.plan.outputs.embeddings }}" \
            --run-ingestion "${RUN_INGESTION}" \
            --wipe-existing-chunks "${WIPE_EXISTING_CHUNKS}" \
            --run-embeddings "${RUN_EMBEDDINGS}" \
            --embedding-source "${EMBEDDING_SOURCE}" \
            --embedding-only-column "${EMBEDDING_ONLY_COLUMN}" \
            --service-public-fiche-config "${SERVICE_PUBLIC_FICHE_CONFIG}" \
            --legifrance-article-ids-json "${LEGIFRANCE_ARTICLE_IDS_JSON}" \
            --wait
