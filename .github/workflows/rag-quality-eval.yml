name: RAG Quality Eval

on:
  pull_request:
    branches: [dev, staging]
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "packages/rag-pipeline/**"
      - "apps/streamlit-ui/pages/01_Chatbot.py"
      - "src/goldset/**"
      - "scripts/run_rag_quality_eval.py"
      - "scripts/prepare_goldset.py"
      - "supabase/migrations/**rag_quality_eval**.sql"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/rag-quality-eval.yml"
  workflow_dispatch:
    inputs:
      eval_mode:
        description: "Eval mode"
        required: true
        type: choice
        options:
          - smoke
          - full
        default: smoke
      target_environment:
        description: "GitHub environment / DB target"
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      goldset_name:
        description: "Goldset name"
        required: true
        type: string
        default: iteration2_V1
      tag:
        description: "Goldset tag filter"
        required: true
        type: string
        default: iteration2
      limit:
        description: "Max questions, 0 = all. Full production eval forces 0."
        required: true
        type: string
        default: "5"
      skip_ragas:
        description: "Skip RAGAS metrics"
        required: true
        type: boolean
        default: true
      skip_judge:
        description: "Skip Scaleway LLM judge"
        required: true
        type: boolean
        default: false
      baseline_run_id:
        description: "Optional baseline rag_quality_eval_runs.id"
        required: false
        type: string
        default: ""
      baseline_run_label:
        description: "Optional baseline rag_quality_eval_runs.run_label"
        required: false
        type: string
        default: ""
      any_goldset:
        description: "Select questions by tag across all goldsets (--any-goldset)"
        required: false
        type: boolean
        default: false
      run_label_suffix:
        description: "Optional suffix appended to the run label (distinct runs on the same sha)"
        required: false
        type: string
        default: ""
      judge_provider:
        description: "Juge du screening manuel (full/production force Scaleway)"
        required: false
        type: choice
        options:
          - openrouter
          - scaleway
        default: openrouter
      judge_model:
        description: "Override du modèle juge pour le screening (interdit sur un gate officiel)"
        required: false
        type: string
        default: ""
      judge_votes:
        description: "Votes du screening manuel (full/production force 3)"
        required: false
        type: choice
        options:
          - "1"
          - "3"
        default: "1"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: rag-quality-eval-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.run_label_suffix || '' }}
  cancel-in-progress: true

jobs:
  rag-quality-eval:
    name: rag quality
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment == 'production' && 'scaleway-production' || 'scaleway-staging' }}
    env:
      SCW_POSTGRES_DSN: ${{ secrets.SCW_POSTGRES_DSN }}
      ALBERT_API_KEY: ${{ secrets.ALBERT_API_KEY }}
      ALBERT_BASE_URL: ${{ vars.ALBERT_BASE_URL || secrets.ALBERT_BASE_URL || 'https://albert.api.etalab.gouv.fr/v1' }}
      SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
      SCALEWAY_BASE_URL: ${{ vars.SCALEWAY_BASE_URL || secrets.SCALEWAY_BASE_URL || 'https://api.scaleway.ai/v1' }}
      # Juge LLM = OpenRouter/Claude (remplace Scaleway qwen3 depuis 2026-07-15).
      # RAGAS reste sur Scaleway (SCALEWAY_API_KEY ci-dessus).
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_BASE_URL: ${{ vars.OPENROUTER_BASE_URL || 'https://openrouter.ai/api/v1' }}
      OPENROUTER_JUDGE_MODEL: ${{ vars.OPENROUTER_JUDGE_MODEL || 'x-ai/grok-4.5' }}
      DEFAULT_BASELINE_RUN_ID: ${{ vars.RAG_QUALITY_BASELINE_RUN_ID || '' }}
      DEFAULT_BASELINE_RUN_LABEL: ${{ vars.RAG_QUALITY_BASELINE_RUN_LABEL || '' }}
      PR_FULL_REQUESTED: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'rag-quality-full') }}

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Resolve eval parameters
        env:
          # Entrées non fiables interpolées nulle part dans le script : passées
          # par variable d'environnement puis validées (guidance GitHub secure-use).
          EVENT_NAME: ${{ github.event_name }}
          EVAL_MODE_INPUT: ${{ inputs.eval_mode }}
          TARGET_ENVIRONMENT_INPUT: ${{ inputs.target_environment }}
          SKIP_JUDGE_INPUT: ${{ inputs.skip_judge }}
          JUDGE_PROVIDER_INPUT: ${{ inputs.judge_provider }}
          RUN_LABEL_SUFFIX: ${{ inputs.run_label_suffix }}
          JUDGE_MODEL_INPUT: ${{ inputs.judge_model }}
          JUDGE_VOTES_INPUT: ${{ inputs.judge_votes }}
        run: |
          set -euo pipefail
          uv run python .github/scripts/rag_quality_protocol.py >> "$GITHUB_ENV"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "GOLDSET_NAME=${{ inputs.goldset_name }}" >> "$GITHUB_ENV"
            echo "GOLDSET_TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
            if [[ "${{ inputs.eval_mode }}" == "full" || "${{ inputs.target_environment }}" == "production" ]]; then
              eval_mode=full
              echo "EVAL_MODE=$eval_mode" >> "$GITHUB_ENV"
              echo "COMPARE_BASELINE=true" >> "$GITHUB_ENV"
              echo "LIMIT=0" >> "$GITHUB_ENV"
            else
              eval_mode=smoke
              echo "EVAL_MODE=$eval_mode" >> "$GITHUB_ENV"
              echo "COMPARE_BASELINE=false" >> "$GITHUB_ENV"
              echo "LIMIT=${{ inputs.limit }}" >> "$GITHUB_ENV"
            fi
            echo "SKIP_RAGAS=${{ inputs.skip_ragas }}" >> "$GITHUB_ENV"
            echo "SKIP_JUDGE=${{ inputs.skip_judge }}" >> "$GITHUB_ENV"
            echo "ANY_GOLDSET=${{ inputs.any_goldset }}" >> "$GITHUB_ENV"
            echo "BASELINE_RUN_ID=${{ inputs.baseline_run_id || vars.RAG_QUALITY_BASELINE_RUN_ID || '' }}" >> "$GITHUB_ENV"
            echo "BASELINE_RUN_LABEL=${{ inputs.baseline_run_label || vars.RAG_QUALITY_BASELINE_RUN_LABEL || '' }}" >> "$GITHUB_ENV"
            label_suffix="${RUN_LABEL_SUFFIX:-}"
            if [[ ! "$label_suffix" =~ ^[A-Za-z0-9._-]*$ ]]; then
              echo "run_label_suffix invalide (autorisé: [A-Za-z0-9._-])" >&2
              exit 1
            fi
            echo "RUN_LABEL=${{ inputs.target_environment }}-$eval_mode-${{ github.sha }}${label_suffix:+-$label_suffix}" >> "$GITHUB_ENV"
          else
            echo "GOLDSET_NAME=iteration2_V1" >> "$GITHUB_ENV"
            echo "GOLDSET_TAG=iteration2" >> "$GITHUB_ENV"
            if [[ "$PR_FULL_REQUESTED" == "true" ]]; then
              echo "EVAL_MODE=full" >> "$GITHUB_ENV"
              echo "COMPARE_BASELINE=true" >> "$GITHUB_ENV"
              echo "LIMIT=0" >> "$GITHUB_ENV"
            else
              echo "EVAL_MODE=smoke" >> "$GITHUB_ENV"
              echo "COMPARE_BASELINE=false" >> "$GITHUB_ENV"
              echo "LIMIT=5" >> "$GITHUB_ENV"
            fi
            echo "SKIP_RAGAS=true" >> "$GITHUB_ENV"
            echo "SKIP_JUDGE=false" >> "$GITHUB_ENV"
            echo "BASELINE_RUN_ID=$DEFAULT_BASELINE_RUN_ID" >> "$GITHUB_ENV"
            echo "BASELINE_RUN_LABEL=$DEFAULT_BASELINE_RUN_LABEL" >> "$GITHUB_ENV"
            echo "RUN_LABEL=pr-${{ github.event.pull_request.number }}-${{ github.sha }}" >> "$GITHUB_ENV"
          fi

      - name: Run RAG quality eval
        run: |
          set -euo pipefail
          limit_args=()
          if [[ "$LIMIT" != "0" && -n "$LIMIT" ]]; then
            limit_args+=(--limit "$LIMIT")
          fi
          ragas_args=()
          judge_args=()
          if [[ "$SKIP_RAGAS" == "true" ]]; then
            ragas_args+=(--skip-ragas)
          fi
          if [[ "$SKIP_JUDGE" == "true" ]]; then
            judge_args+=(--skip-judge)
          else
            judge_args+=(--judge-provider "${JUDGE_PROVIDER:-openrouter}")
            judge_args+=(--judge-votes "${JUDGE_VOTES:-1}")
            if [[ -n "${JUDGE_MODEL_OVERRIDE:-}" ]]; then
              judge_args+=(--judge-model "$JUDGE_MODEL_OVERRIDE")
            fi
          fi
          baseline_args=()
          if [[ "$COMPARE_BASELINE" == "true" ]]; then
            baseline_args+=(--require-baseline --gate-against-baseline)
            if [[ -n "${BASELINE_RUN_ID:-}" ]]; then
              baseline_args+=(--baseline-run-id "$BASELINE_RUN_ID")
            fi
            if [[ -n "${BASELINE_RUN_LABEL:-}" ]]; then
              baseline_args+=(--baseline-run-label "$BASELINE_RUN_LABEL")
            fi
          fi
          any_goldset_args=()
          if [[ "${ANY_GOLDSET:-false}" == "true" ]]; then
            any_goldset_args+=(--any-goldset)
          fi
          dedupe_args=()
          if [[ "$EVAL_MODE" == "smoke" ]]; then
            dedupe_args+=(--skip-if-started)
          fi

          uv run --no-sync python scripts/run_rag_quality_eval.py \
            --goldset-name "$GOLDSET_NAME" \
            --tag "$GOLDSET_TAG" \
            "${any_goldset_args[@]}" \
            "${limit_args[@]}" \
            "${ragas_args[@]}" \
            "${judge_args[@]}" \
            "${baseline_args[@]}" \
            --record-db \
            --init-schema \
            "${dedupe_args[@]}" \
            --dedupe-scope config-and-git \
            --run-label "$RUN_LABEL" \
            --output-dir ".cache/assistant-rh/evals/$RUN_LABEL" \
            | tee "$RUNNER_TEMP/rag-quality.json"

      - name: Summarize
        run: |
          set -euo pipefail
          {
            echo "## RAG quality eval"
            echo ""
            echo "- mode: $EVAL_MODE"
            echo "- compare baseline: $COMPARE_BASELINE"
            echo "- limit: $LIMIT"
            echo ""
            echo "\`\`\`json"
            cat "$RUNNER_TEMP/rag-quality.json"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
