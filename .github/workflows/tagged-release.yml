name: Tagged API delivery

# release.py accepts only successful protected tag pushes already integrated into
# main; no PR code, downloaded artifacts or untrusted caches reach publication.
on: # zizmor: ignore[dangerous-triggers]
  # This privileged definition always comes from the default branch.
  workflow_run:
    workflows: [Kapsule staging]
    types: [completed]
  workflow_dispatch:
    inputs:
      action:
        description: Resume a pending delivery or redeploy a validated release
        type: choice
        options: [resume, redeploy]
        required: true
      release_tag:
        description: Existing protected tag (vX.Y.Z-rc.N or vX.Y.Z)
        type: string
        required: true
      delivery_id:
        description: Redelivery run ID when resuming a recovery; empty for the original release
        type: string
        required: false

permissions:
  contents: read

jobs:
  plan:
    if: >-
      github.repository == 'DGAFP/assistant-rh' &&
      github.ref == 'refs/heads/main' &&
      vars.TAGGED_RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      delivery: ${{ steps.plan.outputs.delivery }}
      tag: ${{ steps.plan.outputs.tag }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      target: ${{ steps.plan.outputs.target }}
      environment: ${{ steps.plan.outputs.environment }}
      action: ${{ steps.plan.outputs.action }}
      delivery_key: ${{ steps.plan.outputs.delivery_key }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the tag and its integrated source revision
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_ENABLED: ${{ vars.KAPSULE_PRODUCTION_CD_ENABLED }}
        run: python3 deploy/api/release.py plan

  qualify-source:
    needs: plan
    if: needs.plan.outputs.delivery == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Existing private fixture secret stays in its current environment. The
    # trusted plan has already verified protected-tag resolution and main ancestry.
    environment: scaleway-staging
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --all-packages --group dev --frozen
      - name: Verify private conformance on the exact tagged source
        env:
          HF_TOKEN: ${{ secrets.HF_CONFORMANCE_TOKEN }}
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          set -euo pipefail
          if ! archive=$(uv run --no-sync python -m scripts.conformance.m0b_private "$RUNNER_TEMP/m0b-private" 2> "$RUNNER_TEMP/m0b-download.log"); then
            echo '::error::Private evidence could not be verified; publication blocked.'
            exit 1
          fi
          if ! env -u HF_TOKEN M0B_PRIVATE_ARCHIVE="$archive" uv run --no-sync python -m pytest apps/api/tests/core/test_m0b_companion.py -q > "$RUNNER_TEMP/m0b-private.log" 2>&1; then
            echo '::error::Private conformance failed; publication blocked.'
            exit 1
          fi
          echo 'Private conformance passed on the exact tagged source.'

  deliver:
    needs: [plan, qualify-source]
    if: needs.plan.outputs.delivery == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ needs.plan.outputs.environment }}
    # Held through publication, Flux reconciliation and authenticated recipe proof.
    concurrency:
      group: assistant-rh-api-tagged-delivery
      cancel-in-progress: false
    permissions:
      contents: write
      deployments: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      RELEASE_ENVIRONMENT: ${{ needs.plan.outputs.target }}
      DELIVERY_KEY: ${{ needs.plan.outputs.delivery_key }}
      RELEASE_VALIDATORS: ${{ vars.RELEASE_VALIDATORS }}
      RELEASE_REGISTRY: ${{ needs.plan.outputs.target == 'staging' && 'rg.fr-par.scw.cloud/assistant-rh-staging' || vars.API_PRODUCTION_REGISTRY }}
      RELEASE_CLUSTER_SERVER: ${{ needs.plan.outputs.target == 'staging' && 'https://fce3ddcb-b9ff-49fb-8b7d-aca605272b0a.api.k8s.fr-par.scw.cloud:6443' || vars.API_PRODUCTION_API_SERVER }}
      DOCKER_CONFIG: /tmp/assistant-rh-api-registry-${{ github.run_id }}-${{ github.run_attempt }}
      TARGET_REGISTRY_CONFIG: /tmp/assistant-rh-api-registry-${{ github.run_id }}-${{ github.run_attempt }}/config.json
      SOURCE_REGISTRY_CONFIG: /tmp/assistant-rh-api-source-${{ github.run_id }}-${{ github.run_attempt }}/config.json
    steps:
      - name: Checkout the trusted coordinator
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require passing CI on the exact source commit
        run: python3 deploy/api/wait-required-checks.py
      - name: Checkout the application source without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.20.2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: 1.3.0
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
      - name: Authenticate the target registry
        env:
          REGISTRY_KEY: ${{ secrets.SCW_REGISTRY_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_KEY"
          mkdir -m 700 -p "$DOCKER_CONFIG"
          printf '%s' "$REGISTRY_KEY" | docker login "${RELEASE_REGISTRY%%/*}" -u nologin --password-stdin
      - name: Authenticate read access to staging for production promotion
        if: needs.plan.outputs.target == 'production' && needs.plan.outputs.delivery_key == 'release'
        env:
          STAGING_READ_KEY: ${{ secrets.SCW_STAGING_REGISTRY_READ_KEY }}
        run: |
          set -euo pipefail
          test -n "$STAGING_READ_KEY"
          mkdir -m 700 -p "$(dirname "$SOURCE_REGISTRY_CONFIG")"
          printf '%s' "$STAGING_READ_KEY" | oras login rg.fr-par.scw.cloud -u nologin --password-stdin --registry-config "$SOURCE_REGISTRY_CONFIG"
      - name: Publish and wait for observed deployment and recipe proof
        run: python3 deploy/api/release.py publish
      - name: Remove registry credentials
        if: always()
        run: |
          rm -f "${TARGET_REGISTRY_CONFIG:-}" "${SOURCE_REGISTRY_CONFIG:-}"
