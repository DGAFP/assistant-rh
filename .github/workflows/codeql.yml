name: CodeQL

on:
  push:
    branches:
      - dev
      - staging
      - main
  pull_request:
    branches:
      - dev
      - staging
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            suppression_pack: codeql/python-queries:AlertSuppression.ql
          - language: javascript-typescript
            suppression_pack: codeql/javascript-queries:AlertSuppression.ql
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          packs: ${{ matrix.suppression_pack }}

      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results

      - name: Dismiss explicitly suppressed alerts
        if: >-
          matrix.language == 'python' &&
          github.event_name == 'push' &&
          (
            github.ref == 'refs/heads/main' ||
            (
              github.ref == 'refs/heads/staging' &&
              contains(github.event.head_commit.message, 'ci: bootstrap suppressed CodeQL alerts')
            )
          )
        uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8 # v2.0.3
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: sarif-results/python.sarif
        env:
          GITHUB_TOKEN: ${{ github.token }}
