name: Conformance Baseline Refresh

on:
  workflow_dispatch:
    inputs:
      source_mode:
        description: "Source query set"
        required: true
        type: choice
        default: sample
        options:
          - sample
          - goldset
      queries_file:
        description: "Queries JSONL file (used for sample mode)"
        required: true
        type: string
        default: tests/conformance/queries.sample.jsonl
      goldset_name:
        description: "Goldset name(s), comma-separated (used for goldset mode)"
        required: true
        type: string
        default: beta_evaluated
      limit:
        description: "Max number of queries (0 = no limit)"
        required: true
        type: string
        default: "50"
      baseline_dir:
        description: "Target baseline output directory"
        required: true
        type: string
        default: tests/conformance/baselines/queries-sample
      refresh_query_processor_cache:
        description: "Rebuild query-processor replay cache"
        required: true
        type: boolean
        default: true
      query_processor_cache_file:
        description: "Target query-processor replay cache file"
        required: true
        type: string
        default: tests/conformance/replay-cache/query-processor.intent.v1.json
      create_pull_request:
        description: "Create or update a PR with refreshed artifacts"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-baselines:
    runs-on: ubuntu-latest
    environment: scaleway-staging
    env:
      SCW_POSTGRES_DSN: ${{ secrets.SCW_POSTGRES_DSN }}
      ALBERT_API_KEY: ${{ secrets.ALBERT_API_KEY }}
      ALBERT_BASE_URL: ${{ vars.ALBERT_BASE_URL || secrets.ALBERT_BASE_URL || 'https://albert.api.etalab.gouv.fr/v1' }}
      SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
      SCALEWAY_BASE_URL: ${{ vars.SCALEWAY_BASE_URL || secrets.SCALEWAY_BASE_URL || 'https://api.scaleway.ai/v1' }}
      NODE_TLS_REJECT_UNAUTHORIZED: "0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync
          pnpm install --frozen-lockfile

      - name: Precheck AI provider configuration
        run: |
          set -euo pipefail

          albert_ok=false
          scaleway_ok=false

          if [[ -n "${ALBERT_API_KEY:-}" && -n "${ALBERT_BASE_URL:-}" ]]; then
            albert_ok=true
          fi
          if [[ -n "${SCALEWAY_API_KEY:-}" && -n "${SCALEWAY_BASE_URL:-}" ]]; then
            scaleway_ok=true
          fi

          {
            echo "## AI provider precheck"
            echo ""
            echo "- Albert configured: \`$albert_ok\`"
            echo "- Scaleway configured: \`$scaleway_ok\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$albert_ok" != "true" && "$scaleway_ok" != "true" ]]; then
            echo "No complete AI provider configuration found. Set ALBERT_API_KEY or SCALEWAY_API_KEY and the corresponding base URL." >&2
            exit 1
          fi

      - name: Dump stage baselines
        env:
          SOURCE_MODE: ${{ inputs.source_mode }}
          QUERIES_FILE: ${{ inputs.queries_file }}
          GOLDSET_NAMES: ${{ inputs.goldset_name }}
          LIMIT: ${{ inputs.limit }}
          BASELINE_DIR: ${{ inputs.baseline_dir }}
        run: |
          set -euo pipefail

          RESOLVED_QUERIES_PATH="$RUNNER_TEMP/conformance-resolved-queries.jsonl"
          echo "BASELINE_DIR=$BASELINE_DIR" >> "$GITHUB_ENV"
          echo "RESOLVED_QUERIES_PATH=$RESOLVED_QUERIES_PATH" >> "$GITHUB_ENV"

          if [[ "$SOURCE_MODE" == "goldset" ]]; then
            goldset_args=()
            IFS=',' read -ra raw_names <<< "$GOLDSET_NAMES"
            for raw in "${raw_names[@]}"; do
              name="$(echo "$raw" | xargs)"
              if [[ -n "$name" ]]; then
                goldset_args+=(--goldset-name "$name")
              fi
            done

            if [[ ${#goldset_args[@]} -eq 0 ]]; then
              echo "No goldset names provided" >&2
              exit 1
            fi

            limit_args=()
            if [[ "$LIMIT" != "0" && -n "$LIMIT" ]]; then
              limit_args+=(--limit "$LIMIT")
            fi

            uv run python scripts/dump_stage_baselines.py \
              "${goldset_args[@]}" \
              "${limit_args[@]}" \
              --output-dir "$BASELINE_DIR" \
              --resolved-queries-out "$RESOLVED_QUERIES_PATH"
          else
            uv run python scripts/dump_stage_baselines.py \
              --queries-file "$QUERIES_FILE" \
              --output-dir "$BASELINE_DIR" \
              --resolved-queries-out "$RESOLVED_QUERIES_PATH"
          fi

      - name: Rebuild query-processor replay cache
        if: ${{ inputs.refresh_query_processor_cache }}
        env:
          BASELINE_DIR: ${{ env.BASELINE_DIR }}
          QP_CACHE_FILE: ${{ inputs.query_processor_cache_file }}
        run: |
          set -euo pipefail
          uv run python scripts/build_query_processor_replay_cache.py \
            --baseline-dir "$BASELINE_DIR" \
            --output "$QP_CACHE_FILE"
          echo "QP_CACHE_FILE=$QP_CACHE_FILE" >> "$GITHUB_ENV"

      - name: Replay sanity check (query-processor)
        if: ${{ inputs.refresh_query_processor_cache }}
        env:
          BASELINE_DIR: ${{ env.BASELINE_DIR }}
          RESOLVED_QUERIES_PATH: ${{ env.RESOLVED_QUERIES_PATH }}
          QP_CACHE_FILE: ${{ env.QP_CACHE_FILE }}
        run: |
          set -euo pipefail
          pnpm --filter @assistant-rh/mastra-pipeline query-processor:conformance \
            --baseline-dir "$BASELINE_DIR" \
            --queries-file "$RESOLVED_QUERIES_PATH" \
            --llm-replay-cache-file "$QP_CACHE_FILE" \
            --output "$RUNNER_TEMP/query-processor-refresh-check.json"

      - name: Upload refresh artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: conformance-baseline-refresh
          path: |
            ${{ inputs.baseline_dir }}/manifest.json
            ${{ inputs.query_processor_cache_file }}
            ${{ env.RESOLVED_QUERIES_PATH }}
            ${{ runner.temp }}/query-processor-refresh-check.json
          if-no-files-found: warn

      - name: Create or update PR
        if: ${{ inputs.create_pull_request }}
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/conformance-refresh-baselines
          delete-branch: false
          commit-message: "chore: refresh conformance baselines"
          title: "chore: refresh conformance baselines"
          body: |
            ## Summary
            - refresh stage baseline artifacts from `${{ inputs.source_mode }}` source mode
            - update query-processor replay cache used by deterministic conformance replay

            ## Inputs
            - source_mode: `${{ inputs.source_mode }}`
            - queries_file: `${{ inputs.queries_file }}`
            - goldset_name: `${{ inputs.goldset_name }}`
            - limit: `${{ inputs.limit }}`
            - baseline_dir: `${{ inputs.baseline_dir }}`
            - refresh_query_processor_cache: `${{ inputs.refresh_query_processor_cache }}`

            👾 Generated with [Letta Code](https://letta.com)
          labels: |
            conformance
          author: Luis Arias <luis.arias@numerique.gouv.fr>
          committer: Luis Arias <luis.arias@numerique.gouv.fr>
