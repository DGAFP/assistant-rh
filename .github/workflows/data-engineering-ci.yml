name: Data Engineering CI

on:
  push:
    paths:
      - ".github/workflows/data-engineering-*.yml"
      - ".github/scripts/data_engineering_plan.py"
      - ".github/scripts/scaleway_data_jobs.py"
      - ".github/scripts/scaleway_rag_health_deploy.py"
      - ".github/data-engineering-jobs.json"
      - "apps/data-ingestion-cli/**"
      - "packages/data-engineering/**"
      - "packages/shared-config/**"
      - "config/**"
      - "scripts/backfill_*_embeddings.py"
      - "scripts/create_scaleway_*_embeddings_job.sh"
      - "scripts/deploy_embeddings_jobs.sh"
      - "Dockerfile.service_public_pipeline"
      - "Dockerfile.service_public_ingestion"
      - "Dockerfile.legifrance_pipeline"
      - "Dockerfile.legifrance_ingestion"
      - "Dockerfile.legifrance_bulk_dump"
      - "Dockerfile.embeddings_job"
      - "Dockerfile.pdf_sources_pipeline"
      - "Dockerfile.rag_health_exporter"
  pull_request:
    branches:
      - dev
      - staging
      - main
    paths:
      - ".github/workflows/data-engineering-*.yml"
      - ".github/scripts/data_engineering_plan.py"
      - ".github/scripts/scaleway_data_jobs.py"
      - ".github/scripts/scaleway_rag_health_deploy.py"
      - ".github/data-engineering-jobs.json"
      - "apps/data-ingestion-cli/**"
      - "packages/data-engineering/**"
      - "packages/shared-config/**"
      - "config/**"
      - "scripts/backfill_*_embeddings.py"
      - "scripts/create_scaleway_*_embeddings_job.sh"
      - "scripts/deploy_embeddings_jobs.sh"
      - "Dockerfile.service_public_pipeline"
      - "Dockerfile.service_public_ingestion"
      - "Dockerfile.legifrance_pipeline"
      - "Dockerfile.legifrance_ingestion"
      - "Dockerfile.legifrance_bulk_dump"
      - "Dockerfile.embeddings_job"
      - "Dockerfile.pdf_sources_pipeline"
      - "Dockerfile.rag_health_exporter"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_CACHE_DIR: .uv-cache

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Ruff check on data engineering code
        run: |
          uv run --no-sync ruff check \
            .github/scripts/data_engineering_plan.py \
            .github/scripts/scaleway_data_jobs.py \
            .github/scripts/scaleway_rag_health_deploy.py \
            apps/data-ingestion-cli/src \
            packages/data-engineering/src \
            packages/shared-config/src \
            --select E,F,I

      - name: Smoke import data engineering packages
        run: |
          uv run --no-sync python -c "
          from assistant_rh_data_engineering.service_public import ServicePublicPipeline
          from assistant_rh_data_engineering.legifrance import LegifrancePipeline
          from assistant_rh_data_engineering.mi import MiPipeline
          from assistant_rh_data_engineering.utils.object_storage import ScalewayObjectStorageSync
          print('Data engineering imports OK')
          "

      - name: Compile critical data engineering modules
        run: |
          python3 -m compileall -q \
            packages/data-engineering/src/assistant_rh_data_engineering \
            packages/shared-config/src/assistant_rh_shared

      - name: Smoke-check CLI entrypoints
        run: |
          uv run --no-sync data-ingestion --help > /dev/null
          uv run --no-sync data-ingestion service-public medallion --help > /dev/null
          uv run --no-sync data-ingestion service-public ingest --help > /dev/null
          uv run --no-sync data-ingestion legifrance bulk-dump --help > /dev/null
          uv run --no-sync data-ingestion legifrance medallion --help > /dev/null
          uv run --no-sync data-ingestion legifrance ingest --help > /dev/null
          uv run --no-sync data-ingestion legifrance url-backfill --help > /dev/null
          uv run --no-sync data-ingestion legifrance r2-summaries --help > /dev/null
          uv run --no-sync data-ingestion mi medallion --help > /dev/null
          uv run --no-sync data-ingestion embeddings service-public --help > /dev/null
          uv run --no-sync data-ingestion embeddings legifrance --help > /dev/null
          uv run --no-sync data-ingestion embeddings matte --help > /dev/null
          uv run --no-sync data-ingestion embeddings mi --help > /dev/null
          uv run --no-sync data-ingestion observability rag-health --help > /dev/null
