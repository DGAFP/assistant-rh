name: Data Engineering Prod Ingestion

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source a ingerer en base prod"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - service_public
          - legifrance

permissions:
  contents: read

concurrency:
  group: data-prod-ingestion
  cancel-in-progress: false

jobs:
  ingest-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: scaleway-production
    env:
      UV_CACHE_DIR: .uv-cache
      SCW_DEFAULT_REGION: fr-par
      SCW_BUCKET_BRONZE: assistant-rh-bronze
      SCW_BUCKET_SILVER: assistant-rh-silver
      SCW_BUCKET_GOLD: assistant-rh-gold
      SCW_PREFIX_STAGING: staging
      SCW_PREFIX_PROD: prod
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_POSTGRES_DSN: ${{ secrets.SCW_POSTGRES_DSN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Ingest Service-Public into Scaleway prod
        if: ${{ github.event.inputs.source == 'all' || github.event.inputs.source == 'service_public' }}
        run: |
          uv run --no-sync data-ingestion service-public ingest \
            --fiche-config config/service_public_fiches.json \
            --target-env prod \
            --from-object-storage \
            --dsn "${SCW_POSTGRES_DSN}"

      - name: Ingest Legifrance into Scaleway prod
        if: ${{ github.event.inputs.source == 'all' || github.event.inputs.source == 'legifrance' }}
        run: |
          uv run --no-sync data-ingestion legifrance ingest \
            --target-env prod \
            --from-object-storage \
            --load-all-artifacts \
            --dsn "${SCW_POSTGRES_DSN}"

      - name: Run prod data quality gates
        run: |
          set -euo pipefail
          mkdir -p artifacts/data-quality

          QUALITY_SOURCES=()
          if [[ "${{ github.event.inputs.source }}" == "all" || "${{ github.event.inputs.source }}" == "service_public" ]]; then
            QUALITY_SOURCES+=(--source service_public)
          fi
          if [[ "${{ github.event.inputs.source }}" == "all" || "${{ github.event.inputs.source }}" == "legifrance" ]]; then
            QUALITY_SOURCES+=(--source legifrance)
          fi

          uv run --no-sync data-ingestion quality gates \
            --target-env prod \
            "${QUALITY_SOURCES[@]}" \
            --blocking \
            --dsn-env SCW_POSTGRES_DSN \
            --json-output artifacts/data-quality/prod-ingestion-report.json \
            --markdown-output artifacts/data-quality/prod-ingestion-summary.md

      - name: Summarize prod data quality gates
        if: always()
        run: |
          if [[ -f artifacts/data-quality/prod-ingestion-summary.md ]]; then
            cat artifacts/data-quality/prod-ingestion-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload prod data quality reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: data-quality-prod-ingestion-${{ github.run_attempt }}
          path: artifacts/data-quality/
          if-no-files-found: ignore
