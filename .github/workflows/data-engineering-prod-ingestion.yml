name: Data Engineering Prod Ingestion

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source a ingerer en base prod"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - service_public
          - legifrance
      wipe_existing_chunks:
        description: "Supprimer les chunks Service-Public existants avant re-ingestion"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: data-prod-ingestion
  cancel-in-progress: false

jobs:
  ingest-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: scaleway-production
    env:
      UV_CACHE_DIR: .uv-cache
      SCW_DEFAULT_REGION: fr-par
      SCW_BUCKET_BRONZE: assistant-rh-bronze
      SCW_BUCKET_SILVER: assistant-rh-silver
      SCW_BUCKET_GOLD: assistant-rh-gold
      SCW_PREFIX_STAGING: staging
      SCW_PREFIX_PROD: prod
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_POSTGRES_DSN: ${{ secrets.SCW_POSTGRES_DSN }}
      WIPE_EXISTING_CHUNKS: ${{ github.event.inputs.wipe_existing_chunks || 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Ingest Service-Public into Scaleway prod
        if: ${{ github.event.inputs.source == 'all' || github.event.inputs.source == 'service_public' }}
        run: |
          WIPE_ARGS=()
          if [[ "${WIPE_EXISTING_CHUNKS}" == "true" ]]; then
            WIPE_ARGS+=(--wipe-existing-chunks)
          fi

          uv run --no-sync data-ingestion service-public ingest \
            --fiche-config config/service_public_fiches.json \
            --target-env prod \
            --from-object-storage \
            --dsn "${SCW_POSTGRES_DSN}" \
            "${WIPE_ARGS[@]}"

      - name: Ingest Legifrance into Scaleway prod
        if: ${{ github.event.inputs.source == 'all' || github.event.inputs.source == 'legifrance' }}
        run: |
          uv run --no-sync data-ingestion legifrance ingest \
            --target-env prod \
            --from-object-storage \
            --load-all-artifacts \
            --dsn "${SCW_POSTGRES_DSN}"
