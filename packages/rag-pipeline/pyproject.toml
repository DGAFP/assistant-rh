[project]
name = "assistant-rh-rag-pipeline"
version = "0.4.2"
description = "Core RAG pipeline for Assistant RH"
requires-python = ">=3.12"

dependencies = [
    # Database
    "psycopg[binary]>=3.3.3",
    "sqlalchemy>=2.0.0",
    # LLM & API
    "openai>=2.28.0",
    "requests>=2.32.0",
    # Data
    "numpy>=2.0.0",
    "pandas>=2.3.0",
    # Config
    "python-dotenv>=1.2.0",
    "filelock>=3.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant_rh_rag_pipeline"]

# Ruff config is inherited from the workspace root pyproject.toml
