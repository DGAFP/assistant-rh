[project]
name = "assistant-rh-shared-config"
version = "0.9.0"
description = "Shared configuration and database utilities for Assistant RH"
requires-python = ">=3.12"

dependencies = [
    # Database
    "psycopg[binary]>=3.3.3",
    "sqlalchemy>=2.0.0",
    # Config
    "python-dotenv>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant_rh_shared"]