$schema: "https://moonrepo.dev/schemas/project.json"

language: "python"
layer: "application"
stack: "backend"

project:
  name: "Assistant RH API"
  description: "OpenAI-compatible HTTP API and internal hexagonal core"

toolchain:
  default: "unstable_uv"

fileGroups:
  sources:
    - "src/**/*.py"
  tests:
    - "tests/**/*.py"
  configs:
    - "pyproject.toml"
    - "moon.yml"
    - "/Dockerfile.api"

tasks:
  dev:
    description: "Run the API development server"
    command: "uv run --package assistant-rh-api assistant-rh-api"
    preset: "server"
    options:
      runFromWorkspaceRoot: true
      cache: false

  lint:
    description: "Lint API source and tests"
    command: "uv run --package assistant-rh-api --group dev ruff check apps/api/src apps/api/tests"
    inputs:
      - "@group(sources)"
      - "@group(tests)"
      - "@group(configs)"
    options:
      runFromWorkspaceRoot: true
      cache: false
      allowFailure: false

  architecture:
    description: "Enforce API import boundaries"
    command: "uv run --package assistant-rh-api --group dev lint-imports --config apps/api/pyproject.toml --no-cache"
    inputs:
      - "@group(sources)"
      - "@group(configs)"
    options:
      runFromWorkspaceRoot: true
      cache: false

  test:
    description: "Run API tests"
    command: "uv run --package assistant-rh-api --group dev python -m pytest apps/api/tests -v --tb=short"
    inputs:
      - "@group(sources)"
      - "@group(tests)"
      - "@group(configs)"
    options:
      runFromWorkspaceRoot: true
      cache: false

  smoke:
    description: "Import the installable API package without starting it"
    command: "uv run --package assistant-rh-api python -c 'import assistant_rh_api; import assistant_rh_api.core'"
    inputs:
      - "@group(sources)"
      - "@group(configs)"
    options:
      runFromWorkspaceRoot: true
      cache: false

  docker-build:
    description: "Build the API container image"
    command: "docker build -f Dockerfile.api -t assistant-rh-api:local ."
    inputs:
      - "@group(sources)"
      - "@group(configs)"
    options:
      runFromWorkspaceRoot: true
      cache: false
