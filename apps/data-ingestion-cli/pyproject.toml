[project]
name = "assistant-rh-data-ingestion-cli"
version = "0.8.0"
description = "Canonical data ingestion CLI for Assistant RH"
requires-python = ">=3.12"

dependencies = [
    "assistant-rh-data-engineering",
]

[project.scripts]
data-ingestion = "assistant_rh_data_ingestion_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant_rh_data_ingestion_cli"]

[tool.uv.sources]
assistant-rh-data-engineering = { workspace = true }
